[package]
name = "rule-and-compass"
version = "0.1.0"
edition = "2021"
description = "A symbolic-regression engine: evolve short equations that fit data"
license = "MIT"
build = "build.rs"

[lib]
name = "rcsr"
path = "src/lib.rs"

[[bin]]
name = "rcsr"
path = "src/main.rs"

[[bin]]
name = "rcsr-gpu-bench"
path = "src/bin/gpu_bench.rs"
required-features = ["cuda"]

[features]
default = []
cuda = []

[dependencies]

[profile.release]
opt-level = 3