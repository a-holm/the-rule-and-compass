[package]
name = "rule-and-compass"
version = "0.1.0"
edition = "2021"
description = "A symbolic-regression engine: evolve short equations that fit data"
license = "MIT"
build = "build.rs"

[lib]
name = "rcsr"
path = "src/lib.rs"

[[bin]]
name = "rcsr"
path = "src/main.rs"

[[bin]]
name = "rcsr-gpu-bench"
path = "src/bin/gpu_bench.rs"
required-features = ["cuda"]

[[bin]]
name = "rcsr-bench"
path = "src/bin/rcsr_bench.rs"

[[bin]]
name = "rcsr-launch"
path = "src/bin/rcsr_launch.rs"

[[bin]]
name = "rcsr-rss"
path = "src/bin/rcsr_rss.rs"

[[bin]]
name = "cpu_bench"
path = "src/bin/cpu_bench.rs"

[[bin]]
name = "rcsr_serve"
path = "src/bin/rcsr_serve.rs"
required-features = []

[features]
default = []
cuda = []

[dependencies]

[profile.release]
opt-level = 3